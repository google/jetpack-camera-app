syntax = "proto3";

package com.google.jetpackcamera.settings.proto;

import "com/google/jetpackcamera/model/proto/aspect_ratio.proto";
import "com/google/jetpackcamera/model/proto/dark_mode.proto";
import "com/google/jetpackcamera/model/proto/dynamic_range.proto";
import "com/google/jetpackcamera/model/proto/flash_mode.proto";
import "com/google/jetpackcamera/model/proto/image_output_format.proto";
import "com/google/jetpackcamera/model/proto/lens_facing.proto";
import "com/google/jetpackcamera/model/proto/stabilization_mode.proto";
import "com/google/jetpackcamera/model/proto/video_quality.proto";
import "com/google/jetpackcamera/model/proto/low_light_boost_priority.proto";
import "com/google/jetpackcamera/model/proto/concurrent_camera_mode.proto";


option java_package = "com.google.jetpackcamera.settings.proto";
option java_multiple_files = true;

message CameraAppSettings {
  // Camera settings
  com.google.jetpackcamera.model.proto.LensFacing default_lens_facing = 1;
  com.google.jetpackcamera.model.proto.FlashMode flash_mode = 2;
  int32 target_frame_rate = 3;
  com.google.jetpackcamera.model.proto.AspectRatio aspect_ratio = 4;
  com.google.jetpackcamera.model.proto.StabilizationMode stabilization_mode = 6;
  com.google.jetpackcamera.model.proto.DynamicRange dynamic_range = 8;
  com.google.jetpackcamera.model.proto.ImageOutputFormat image_format = 10;
  uint64 max_video_duration_millis = 11;
  com.google.jetpackcamera.model.proto.VideoQuality video_quality = 12;
  bool audio_enabled = 13;
  com.google.jetpackcamera.model.proto.LowLightBoostPriority low_light_boost_priority = 14;

  // Non-camera app settings
  com.google.jetpackcamera.model.proto.DarkMode dark_mode = 9;
  com.google.jetpackcamera.model.proto.ConcurrentCameraMode concurrent_camera_mode = 15;
  string selected_camera_effect = 16;
}
